name: report every 3 days

on:
  schedule:
    # days 1,4,7,...,31 of the month at 05:20 UTC (08:20 MSK)
    - cron: '20 5 */3 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/report.mjs
      - name: commit
        run: |
          git config user.name "roblox-pulse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data/meta.json
          git diff --cached --quiet && exit 0
          git commit -m "report: $(date -u +'%Y-%m-%d')"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
