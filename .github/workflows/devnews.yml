name: devnews every 6h

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: devnews
  cancel-in-progress: false

jobs:
  devnews:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/devnews.mjs --days 7
      - run: node scripts/devnews.mjs pick --days 3 --top 15
      - name: commit
        run: |
          git config user.name "roblox-pulse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/devnews
          git diff --cached --quiet && exit 0
          git commit -m "devnews: $(date -u +'%Y-%m-%d %H:00') UTC"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
