<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roblox Pulse</title>
<meta name="description" content="Daily, weekly and monthly marketing report on Roblox games: leaders, rising and falling games, genres.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='4' y='4' width='24' height='24' rx='5' fill='%232a78d6' transform='rotate(15 16 16)'/><rect x='13' y='13' width='6' height='6' fill='white' transform='rotate(15 16 16)'/></svg>">
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --card: #ffffff;
  --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10);
  --up: #006300; --down: #d03b3b; --accent: #2a78d6; --accent-wash: rgba(42,120,214,0.10);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --seq: #2a78d6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --card: #1a1a19;
    --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
    --up: #0ca30c; --down: #e66767; --accent: #3987e5; --accent-wash: rgba(57,135,229,0.14);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --seq: #3987e5;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --card: #1a1a19;
  --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
  --up: #0ca30c; --down: #e66767; --accent: #3987e5; --accent-wash: rgba(57,135,229,0.14);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --seq: #3987e5;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color: var(--accent); }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px 64px; }
header.top { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 20px 0 8px; }
.brand { font-weight: 650; font-size: 18px; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; }
.brand .logo { width: 22px; height: 22px; border-radius: 5px; background: var(--accent); transform: rotate(15deg); position: relative; }
.brand .logo::after { content: ""; position: absolute; inset: 8px; background: var(--surface); }
.tabs { display: flex; gap: 4px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 3px; }
.tabs button { border: 0; background: transparent; border-radius: 7px; padding: 5px 12px; color: var(--ink-2); }
.tabs button[aria-selected="true"] { background: var(--accent-wash); color: var(--ink); font-weight: 600; }
.tabs button:disabled { opacity: 0.4; cursor: default; }
.controls { display: flex; gap: 8px; align-items: center; }
select, button { font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; }
button { cursor: pointer; }
h1 { font-size: clamp(26px, 4vw, 36px); line-height: 1.15; margin: 20px 0 4px; letter-spacing: -0.02em; }
.sub { color: var(--ink-2); margin: 0 0 20px; }
h2 { font-size: 20px; margin: 40px 0 4px; letter-spacing: -0.01em; }
h2 + .hint { color: var(--ink-2); margin: 0 0 14px; font-size: 14px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
.summary { font-size: 16px; }
.summary h3 { margin: 16px 0 6px; font-size: 16px; }
.summary p { margin: 0 0 10px; }
.summary ul { margin: 0 0 10px; padding-left: 20px; }
.summary li { margin: 4px 0; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-top: 16px; }
.tile .label { color: var(--ink-2); font-size: 13px; }
.tile .value { font-size: 28px; font-weight: 600; line-height: 1.2; margin-top: 2px; }
.tile .delta { font-size: 13px; margin-top: 2px; }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--ink-2); }
.grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.leader { display: flex; flex-direction: column; gap: 6px; padding: 12px; }
.leader .head { display: flex; gap: 10px; align-items: center; min-width: 0; }
.leader img, .row-icon { width: 40px; height: 40px; border-radius: 8px; flex: none; background: var(--grid); }
.leader .name { font-weight: 600; font-size: 14px; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.leader .meta { color: var(--muted); font-size: 12px; }
.leader .nums { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--ink-2); }
.leader .nums b { font-size: 18px; color: var(--ink); font-weight: 600; }
.rank { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; min-width: 22px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 820px) { .two { grid-template-columns: 1fr; } }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
td { padding: 8px; border-bottom: 1px solid var(--grid); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td .gname { display: flex; align-items: center; gap: 8px; min-width: 0; }
td .gname img { width: 28px; height: 28px; border-radius: 6px; flex: none; background: var(--grid); }
td .gname span { overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
td .g { color: var(--muted); font-size: 12px; }
.table-scroll { overflow-x: auto; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.tip { position: absolute; pointer-events: none; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.12); white-space: nowrap; z-index: 5; display: none; }
.tip .t { color: var(--ink-2); margin-bottom: 4px; }
.tip .r { display: flex; align-items: center; gap: 6px; }
.tip .r b { margin-left: auto; padding-left: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
.key { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--ink-2); margin-bottom: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.bars .row { display: grid; grid-template-columns: minmax(110px, 190px) 1fr 70px; gap: 10px; align-items: center; padding: 5px 0; font-size: 14px; }
.bars .track { height: 14px; position: relative; }
.bars .fill { height: 100%; background: var(--seq); border-radius: 0 4px 4px 0; }
.bars .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bars .val { text-align: right; font-variant-numeric: tabular-nums; }
.pill { display: inline-block; font-size: 11px; color: var(--ink-2); border: 1px solid var(--border); border-radius: 99px; padding: 1px 8px; }
.method { color: var(--ink-2); font-size: 14px; }
.method li { margin: 4px 0; }
.empty { color: var(--muted); font-size: 14px; }
footer { color: var(--muted); font-size: 13px; margin-top: 48px; }
.insights { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
@media (max-width: 400px) { .insights { grid-template-columns: 1fr; } }
.insight { display: flex; flex-direction: column; gap: 8px; }
.insight h3 { font-size: 15px; line-height: 1.3; margin: 0; }
.insight h3 a { color: var(--ink); text-decoration: none; }
.insight h3 a:hover { text-decoration: underline; }
.insight .src { color: var(--muted); font-size: 12px; }
.insight .nums { display: flex; flex-wrap: wrap; gap: 6px; }
.insight .nums span { background: var(--accent-wash); border-radius: 6px; padding: 2px 8px; font-size: 13px; font-weight: 600; }
.insight p { margin: 0; font-size: 14px; }
.insight .why { color: var(--ink-2); font-size: 13px; border-left: 2px solid var(--axis); padding-left: 8px; }
.insight details summary { cursor: pointer; color: var(--muted); font-size: 12px; }
.insight details p { margin-top: 6px; color: var(--ink-2); }
.conf { font-size: 11px; color: var(--ink-2); }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="logo"></span>Roblox Pulse</div>
    <nav class="tabs" id="tabs" aria-label="Issue type"></nav>
    <div class="controls">
      <label for="issue" class="sub" style="margin:0">Issue</label>
      <select id="issue"></select>
      <button id="theme" title="Toggle theme">◐</button>
    </div>
  </header>
  <main id="app"><p class="empty">Loading…</p></main>
  <footer>Data: Rolimons (player history), Roblox API (genres, home page sorts). Issues: daily, weekly roundup on Mondays, monthly roundup on the 1st.</footer>
</div>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const nf = new Intl.NumberFormat('en-US');
const compact = n => n == null ? '—' : n >= 1e6 ? (n / 1e6).toFixed(n >= 1e7 ? 1 : 2).replace(/[.,]?0+$/, '') + 'M' : n >= 1e3 ? (n / 1e3).toFixed(n >= 1e4 ? 0 : 1).replace(/[.,]0$/, '') + 'K' : String(Math.round(n));
const delta = (v, suffix = '%') => v == null ? '<span class="flat">—</span>' : `<span class="${v > 0.5 ? 'up' : v < -0.5 ? 'down' : 'flat'}">${v > 0 ? '▲ +' : v < 0 ? '▼ ' : ''}${v}${suffix}</span>`;
const dmy = s => new Date(s + 'T00:00:00Z').toLocaleDateString('en-US', { day: 'numeric', month: 'long', timeZone: 'UTC' });
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const SERIES = ['--s1', '--s2', '--s3', '--s4', '--s5', '--s6', '--s7', '--s8'];
const GENRE_NAMES = { 'Не указан': 'Unspecified' };
const genreName = g => GENRE_NAMES[g] || g;

// ---------- theme
const themeBtn = $('#theme');
try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
themeBtn.onclick = () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('theme', document.documentElement.dataset.theme); } catch {}
  if (window.__data) render(window.__data, window.__summary);
};

// ---------- tiny markdown (headings, lists, bold, italics, links)
function md(src) {
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\*(.+?)\*/g, '<i>$1</i>').replace(/\[(.+?)\]\((https?:[^)]+)\)/g, '<a href="$2">$1</a>');
  let out = '', list = false;
  for (const line of src.split(/\r?\n/)) {
    const li = line.match(/^\s*[-*]\s+(.*)/);
    if (li) { if (!list) { out += '<ul>'; list = true; } out += `<li>${inline(li[1])}</li>`; continue; }
    if (list) { out += '</ul>'; list = false; }
    const h = line.match(/^#{1,3}\s+(.*)/);
    if (h) out += `<h3>${inline(h[1])}</h3>`;
    else if (line.trim()) out += `<p>${inline(line)}</p>`;
  }
  return out + (list ? '</ul>' : '');
}

// ---------- charts (plain SVG)
const niceMax = v => { if (v <= 0) return 1; const p = 10 ** Math.floor(Math.log10(v)); return [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10].map(m => m * p).find(m => m >= v); };

function lineChart(el, { labels, series, height = 240, yFmt = compact, tipLabel = l => l, legend = true, xTicks = 6 }) {
  const W = Math.max(el.clientWidth, 280), H = height, m = { t: 10, r: 12, b: 24, l: 44 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const max = niceMax(Math.max(...series.flatMap(s => s.values)));
  const x = i => m.l + (labels.length === 1 ? iw / 2 : i / (labels.length - 1) * iw);
  const y = v => m.t + ih - v / max * ih;
  const ticks = [0, 0.25, 0.5, 0.75, 1].map(f => f * max);
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
  for (const t of ticks) svg += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(t)}" y2="${y(t)}" stroke="var(--${t ? 'grid' : 'axis'})" stroke-width="1"/><text x="${m.l - 6}" y="${y(t) + 4}" text-anchor="end">${yFmt(t)}</text>`;
  const step = Math.max(1, Math.round(labels.length / xTicks));
  labels.forEach((l, i) => { if (i % step === 0 || i === labels.length - 1 && (labels.length - 1) % step > step / 2) svg += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${esc(l)}</text>`; });
  series.forEach(s => {
    const d = s.values.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
    if (s.area) svg += `<path d="${d}L${x(s.values.length - 1)},${y(0)}L${x(0)},${y(0)}Z" fill="${s.color}" opacity="0.10"/>`;
    svg += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const li = s.values.length - 1;
    svg += `<circle cx="${x(li)}" cy="${y(s.values[li])}" r="4" fill="${s.color}" stroke="var(--card)" stroke-width="2"/>`;
  });
  svg += `<line class="xh" x1="0" x2="0" y1="${m.t}" y2="${m.t + ih}" stroke="var(--axis)" stroke-width="1" visibility="hidden"/>`;
  svg += `<g class="dots"></g><rect x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent"/></svg>`;
  el.innerHTML = (legend && series.length > 1 ? `<div class="legend">${series.map(s => `<span><i class="key" style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>` : '') + `<div class="chart">${svg}<div class="tip"></div></div>`;
  const svgEl = $('svg', el), tip = $('.tip', el), xh = $('.xh', el), dots = $('.dots', el);
  const move = ev => {
    const r = svgEl.getBoundingClientRect(), px = (ev.clientX - r.left) * W / r.width;
    const i = Math.max(0, Math.min(labels.length - 1, Math.round((px - m.l) / iw * (labels.length - 1))));
    xh.setAttribute('x1', x(i)); xh.setAttribute('x2', x(i)); xh.setAttribute('visibility', 'visible');
    dots.innerHTML = series.map(s => `<circle cx="${x(i)}" cy="${y(s.values[i])}" r="4" fill="${s.color}" stroke="var(--card)" stroke-width="2"/>`).join('');
    const rows = [...series].sort((a, b) => b.values[i] - a.values[i]);
    tip.innerHTML = `<div class="t">${esc(tipLabel(labels[i], i))}</div>` + rows.map(s => `<div class="r"><i class="key" style="background:${s.color}"></i>${esc(s.name)}<b>${yFmt(s.values[i], true)}</b></div>`).join('');
    tip.style.display = 'block';
    const left = x(i) / W * r.width;
    tip.style.left = Math.min(Math.max(left + 12, 0), r.width - tip.offsetWidth) + 'px';
    if (left + 12 + tip.offsetWidth > r.width) tip.style.left = Math.max(0, left - tip.offsetWidth - 12) + 'px';
    tip.style.top = '4px';
  };
  svgEl.addEventListener('pointermove', move);
  svgEl.addEventListener('pointerleave', () => { tip.style.display = 'none'; xh.setAttribute('visibility', 'hidden'); dots.innerHTML = ''; });
}

function spark(values, w = 120, h = 32, color = 'var(--accent)') {
  const max = Math.max(...values, 1), min = Math.min(...values, 0);
  const pts = values.map((v, i) => `${(i / (values.length - 1) * (w - 4) + 2).toFixed(1)},${(h - 3 - (v - min) / (max - min || 1) * (h - 6)).toFixed(1)}`);
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true"><path d="M${pts.join('L')}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${pts.at(-1).split(',')[0]}" cy="${pts.at(-1).split(',')[1]}" r="3" fill="${color}"/></svg>`;
}

function columns(el, items, { height = 220, label, value, tip }) {
  const W = Math.max(el.clientWidth, 280), H = height, m = { t: 16, r: 8, b: 26, l: 40 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b, n = items.length, band = iw / n, bw = Math.min(24, band * 0.6);
  const max = niceMax(Math.max(...items.map(value)));
  const y = v => m.t + ih - v / max * ih;
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
  for (const f of [0, 0.5, 1]) svg += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(f * max)}" y2="${y(f * max)}" stroke="var(--${f ? 'grid' : 'axis'})"/><text x="${m.l - 6}" y="${y(f * max) + 4}" text-anchor="end">${compact(f * max)}</text>`;
  items.forEach((it, i) => {
    const v = value(it), cx = m.l + band * i + band / 2, top = y(v), hgt = Math.max(0, y(0) - top), r = Math.min(4, hgt);
    svg += `<g class="col" data-i="${i}"><rect x="${cx - band / 2}" y="${m.t}" width="${band}" height="${ih}" fill="transparent"/>`;
    svg += `<path d="M${cx - bw / 2},${y(0)}V${top + r}Q${cx - bw / 2},${top} ${cx - bw / 2 + r},${top}H${cx + bw / 2 - r}Q${cx + bw / 2},${top} ${cx + bw / 2},${top + r}V${y(0)}Z" fill="var(--seq)"/>`;
    svg += `<text x="${cx}" y="${top - 4}" text-anchor="middle" style="fill:var(--ink-2)">${nf.format(v)}</text><text x="${cx}" y="${H - 8}" text-anchor="middle">${esc(label(it))}</text></g>`;
  });
  el.innerHTML = `<div class="chart">${svg}</svg><div class="tip"></div></div>`;
  const t = $('.tip', el), svgEl = $('svg', el);
  el.querySelectorAll('.col').forEach(g => {
    g.addEventListener('pointerenter', () => { const it = items[g.dataset.i]; t.innerHTML = tip(it); t.style.display = 'block'; const r = svgEl.getBoundingClientRect(), cx = (m.l + band * g.dataset.i + band / 2) / W * r.width; t.style.left = Math.max(0, Math.min(cx - t.offsetWidth / 2, r.width - t.offsetWidth)) + 'px'; t.style.top = '0px'; });
    g.addEventListener('pointerleave', () => t.style.display = 'none');
  });
}

// ---------- page
const gameCell = g => `<div class="gname">${g.icon ? `<img src="${esc(g.icon)}" alt="" loading="lazy">` : ''}<span><a href="https://www.roblox.com/games/${g.pid}" target="_blank" rel="noopener">${esc(g.name)}</a><br><span class="g">${esc(genreName(g.genre))}${g.sub ? ' · ' + esc(g.sub) : ''}</span></span></div>`;

function gameTable(rows, cols) {
  if (!rows.length) return '<p class="empty">No games match the criteria in this issue.</p>';
  return `<div class="table-scroll"><table><thead><tr>${cols.map(c => `<th class="${c.num ? 'num' : ''}">${c.h}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${cols.map(c => `<td class="${c.num ? 'num' : ''}">${c.v(r)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}

const KIND = { developer: "developer", studio: "studio", staff: "Roblox", analyst: "analyst" };
const CONF = { official: "official data", "self-reported": "self-reported", "community-claim": "community claim" };
const SRC = { devforum: "DevForum", reddit: "Reddit", hackernews: "Hacker News", rss: "Newsletter", youtube: "YouTube", medium: "Medium" };
function insightsHtml(ins) {
  if (!ins?.items?.length) return "";
  return `<h2>Developer insights</h2><p class="hint">${esc(ins.headline_en || "What developers say about monetization, metrics and promotion.")}</p>
    <div class="insights">${ins.items.map(i => `<article class="card insight">
      <div class="src">${esc(SRC[i.source] || i.source)} · ${esc(i.author || "")}${i.author_kind ? " (" + esc(KIND[i.author_kind] || i.author_kind) + ")" : ""} · ${i.date ? dmy(i.date.slice(0, 10)) : ""}</div>
      <h3><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a></h3>
      ${i.key_numbers?.length ? `<div class="nums">${i.key_numbers.map(n => `<span>${esc(n)}</span>`).join("")}</div>` : ""}
      <p>${esc(i.summary_en)}</p>
      ${i.why_en ? `<div class="why">${esc(i.why_en)}</div>` : ""}
      ${i.confidence ? `<div class="conf">Confidence: ${esc(CONF[i.confidence] || i.confidence)}</div>` : ""}
    </article>`).join("")}</div>`;
}

const LBLS = { daily: 'over 24 hours', weekly: 'over the week', monthly: 'over the month' };
const VSS = { daily: 'vs. the same day last week', weekly: 'vs. the previous week', monthly: 'vs. the previous 30 days' };
const TITLES = { daily: 'Daily issue', weekly: 'Weekly roundup', monthly: 'Monthly roundup' };
const LBL = d => LBLS[d.period] || d.label, VS = d => VSS[d.period] || d.vs;
const fmtN = n => n >= 1e6 ? (n / 1e6).toFixed(2).replace(/\.?0+$/, '') + 'M' : n >= 1e3 ? Math.round(n / 1e3) + 'K' : String(n);
const sgn = v => (v >= 0 ? '+' : '') + v;
function factsEn(d) {
  const T = d.totals, f = [], L = LBL(d), V = VS(d), days = T.dailyTotal.length;
  f.push(`Total online of the ${nf.format(d.source.historyGames)} largest games ${L}: ${fmtN(Math.round(T.avg3))} on average, ${sgn(T.change3)}% ${V}.`);
  const l = d.leaders[0]; f.push(`Leader: “${l.name}” with ${fmtN(l.avg3)} players on average, ${sgn(l.change3)}% ${V}.`);
  const r = d.risers[0]; if (r) f.push(`Fastest riser: “${r.name}” (${genreName(r.genre)}), +${r.change3}% ${V}, now ${fmtN(r.now)}.`);
  const fl = d.fallers[0]; if (fl) f.push(`Biggest drop: “${fl.name}”, ${fl.change3}% ${V}, ${fl.fromPeak}% from its ${days}-day peak.`);
  const gUp = d.genres.filter(g => g.avg3 > T.avg3 * 0.02 && g.change3 != null).sort((a, b) => b.change3 - a.change3);
  if (gUp.length) f.push(`Best genre trend: ${genreName(gUp[0].genre)} (${sgn(gUp[0].change3)}% ${V}); weakest: ${genreName(gUp.at(-1).genre)} (${gUp.at(-1).change3}%).`);
  f.push(`The top 10 games account for ${T.top10Share}% of all online across ${nf.format(d.source.games)} tracked games.`);
  return f;
}

function render(d, summary) {
  const T = d.totals;
  const dayShort = l => new Date(l + 'T00:00:00Z').toLocaleDateString('en-US', { day: 'numeric', month: 'short', timeZone: 'UTC' });
  const summaryHtml = summary ? md(summary) : `<ul>${factsEn(d).map(f => `<li>${esc(f)}</li>`).join('')}</ul>`;
  $('#app').innerHTML = `
    <h1>${esc(TITLES[d.period] || "Roblox market")}: ${dmy(d.date)}</h1>
    <p class="sub">Average online ${esc(LBL(d))}, changes ${esc(VS(d))} · ${nf.format(d.source.historyGames)} games with history, ${nf.format(d.source.games)} in the full snapshot</p>
    <section class="card summary">${summaryHtml}</section>
    <div class="tiles">
      <div class="card tile"><div class="label">Online now, all tracked games</div><div class="value">${compact(T.online)}</div><div class="delta flat">${nf.format(T.online)} players</div></div>
      <div class="card tile"><div class="label">Average online of top games ${esc(LBL(d))}</div><div class="value">${compact(T.avg3)}</div><div class="delta">${delta(T.change3)} ${esc(VS(d))}</div></div>
      <div class="card tile"><div class="label">Top-10 share of online</div><div class="value">${T.top10Share}%</div><div class="delta flat">top 100: ${T.top100Share}%</div></div>
      <div class="card tile"><div class="label">Games with 10K+ online</div><div class="value">${T.over10k}</div><div class="delta flat">1K+: ${nf.format(T.over1k)}</div></div>
    </div>

    <h2>Total online, 30 days</h2><p class="hint">Sum of the daily average online of the largest games in this issue.</p>
    <div class="card"><div id="c-total"></div></div>

    <h2>Leaders</h2><p class="hint">Top 12 by average online ${esc(LBL(d))}; percent is ${esc(VS(d))}. The line is the daily average online over ${T.dailyTotal.length} days.</p>
    <div class="grid-cards">${d.leaders.map(g => `
      <div class="card leader">
        <div class="head"><span class="rank">#${g.rank}</span>${g.icon ? `<img src="${esc(g.icon)}" alt="" loading="lazy">` : ''}<div style="min-width:0"><div class="name"><a href="https://www.roblox.com/games/${g.pid}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none">${esc(g.name)}</a></div><div class="meta">${esc(genreName(g.genre))}${g.prevRank ? ` · was #${g.prevRank}` : d.prevDate ? ' · new in the top' : ''}</div></div></div>
        <div class="nums"><span><b>${compact(g.avg3)}</b> on average</span><span>${delta(g.change3)}</span></div>
        <div>${spark(g.daily, 226, 44)}</div>
        <div class="meta">30-day peak ${compact(g.peak30)} · from peak ${delta(g.fromPeak)}</div>
      </div>`).join('')}
    </div>

    <h2>Leaders by hour, 7 days</h2><p class="hint">Top 6: daily cycles and update spikes are visible.</p>
    <div class="card"><div id="c-leaders"></div></div>

    <h2>Rising</h2><p class="hint">Growth of average online ${esc(LBL(d))} ${esc(VS(d))}. Games with 3K+ online.</p>
    <div class="card">${gameTable(d.risers, [
      { h: 'Game', v: gameCell }, { h: '30 days', v: g => spark(g.daily, 90, 26) },
      { h: 'Now', num: 1, v: g => compact(g.now) }, { h: 'Average', num: 1, v: g => compact(g.avg3) }, { h: 'Change', num: 1, v: g => delta(g.change3) },
    ])}</div>

    <h2>Losing players</h2><p class="hint">Drop in average online ${esc(VS(d))} (games that had 5K+) and how much is left from the ${T.dailyTotal.length}-day peak.</p>
    <div class="card">${gameTable(d.fallers, [
      { h: 'Game', v: gameCell }, { h: '30 days', v: g => spark(g.daily, 90, 26, 'var(--down)') },
      { h: 'Average', num: 1, v: g => compact(g.avg3) }, { h: 'Change', num: 1, v: g => delta(g.change3) }, { h: 'From peak', num: 1, v: g => delta(g.fromPeak) },
    ])}</div>

    <div class="two" style="margin-top:0">
      <div><h2>New hits</h2><p class="hint">Games younger than 60 days, by online.</p>
      <div class="card">${gameTable(d.newHits, [
        { h: 'Game', v: gameCell }, { h: 'Age', num: 1, v: g => g.ageDays + ' d' }, { h: 'Average', num: 1, v: g => compact(g.avg3) },
      ])}</div></div>
      <div><h2>What Roblox promotes</h2><p class="hint">Games in the home page sorts ${esc(LBL(d))}.</p>
      <div class="card">${d.pushed.map(s => `<div style="margin-bottom:12px"><span class="pill">${esc(s.name)}</span></div>${gameTable(s.games.slice(0, 8), [
        { h: 'Game', v: g => gameCell(g) }, { h: 'Best rank', num: 1, v: g => '#' + g.best }, { h: 'Now', num: 1, v: g => compact(g.now) },
      ])}`).join('<div style="height:16px"></div>')}</div></div>
    </div>

    ${insightsHtml(window.__insights)}

    <h2>Genres</h2><p class="hint">Share of online of the largest games by Roblox genre, and change ${esc(VS(d))}.</p>
    <div class="two">
      <div class="card bars" id="c-genres"></div>
      <div class="card"><div style="font-size:13px;color:var(--ink-2);margin-bottom:6px">Genre share of online by day, top 6 genres, %</div><div id="c-genre-share"></div></div>
    </div>

    <h2>Games by online range</h2><p class="hint">How many games sit in each online range right now (out of ${nf.format(d.source.games)} tracked).</p>
    <div class="two">
      <div class="card"><div id="c-dist"></div></div>
      <div class="card"><div style="font-size:13px;color:var(--ink-2);margin-bottom:6px">Total online in range</div><div id="c-dist2"></div></div>
    </div>

    <h2>Methodology</h2>
    <div class="card method"><ul>
      <li>“Online now” is a Rolimons snapshot of ${nf.format(d.source.games)} games at the time the report was built.</li>
      <li>History is Rolimons 10-minute points averaged by the hour and supplemented with our own hourly snapshots. The daily issue is compared with the same day a week earlier because weekend online on Roblox is almost twice as high as on weekdays; the weekly one with the previous week, the monthly one with the previous 30 days.</li>
      <li>The sample covers the top 150 games by online, games from the previous issue and games from the Up-and-Coming / Top Trending sorts.</li>
      <li>Genres follow the official Roblox classification (genre_l1 / genre_l2).</li>
      <li>Generated ${new Date(d.generatedAt).toLocaleString('en-US', { timeZone: 'UTC' })} UTC.</li>
    </ul></div>`;

  lineChart($('#c-total'), { labels: T.dayLabels.map(dayShort), series: [{ name: 'Online', values: T.dailyTotal, color: cssVar('--s1'), area: true }], tipLabel: (l, i) => dmy(T.dayLabels[i]) });

  const hours = d.leaders[0].hourly7.length;
  const hourLabels = Array.from({ length: hours }, (_, i) => { const t = new Date(new Date(d.generatedAt).setUTCMinutes(0, 0, 0) - (hours - 1 - i) * 3600e3); return t; });
  lineChart($('#c-leaders'), {
    labels: hourLabels.map(t => t.toLocaleDateString('en-US', { day: 'numeric', month: 'short', timeZone: 'UTC' })),
    series: d.leaders.slice(0, 6).map((g, i) => ({ name: g.name, values: g.hourly7, color: cssVar(SERIES[i]) })),
    height: 300, xTicks: 7,
    tipLabel: (l, i) => hourLabels[i].toLocaleString('en-US', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', timeZone: 'UTC' }) + ' UTC',
  });

  const gmax = Math.max(...d.genres.map(g => g.share));
  $('#c-genres').innerHTML = `<div class="row" style="color:var(--muted);font-size:12px;padding-top:0"><span>Genre</span><span>Share of online</span><span class="val">Chg.</span></div>` +
    d.genres.filter(g => g.share >= 0.5).map(g => `<div class="row" title="${esc(genreName(g.genre))}: ${nf.format(g.avg3)} players, ${g.games} games, leader: ${esc(g.top)}">
      <span class="label">${esc(genreName(g.genre))}</span>
      <span class="track"><div class="fill" style="width:${g.share / gmax * 100}%"></div><span style="position:absolute;left:calc(${g.share / gmax * 100}% + 6px);top:-3px;font-size:12px;color:var(--ink-2)">${g.share}%</span></span>
      <span class="val">${delta(g.change3)}</span></div>`).join('');

  lineChart($('#c-genre-share'), {
    labels: T.dayLabels.map(dayShort),
    series: d.genres.slice(0, 6).map((g, i) => ({ name: genreName(g.genre), values: g.shareDaily, color: cssVar(SERIES[i]) })),
    yFmt: (v, tip) => tip ? String(v) + '%' : Math.round(v) + '%', height: 260, tipLabel: (l, i) => dmy(T.dayLabels[i]),
  });

  const rng = b => `${compact(b.lo)}${b.hi ? '–' + compact(b.hi) : '+'}`;
  columns($('#c-dist'), d.distribution, { label: rng, value: b => b.games, tip: b => `<div class="t">${rng(b)} online</div><div class="r">Games<b>${nf.format(b.games)}</b></div><div class="r">Players<b>${nf.format(b.players)}</b></div>` });
  columns($('#c-dist2'), d.distribution, { label: rng, value: b => b.players, tip: b => `<div class="t">${rng(b)} online</div><div class="r">Players<b>${nf.format(b.players)}</b></div><div class="r">Games<b>${nf.format(b.games)}</b></div>` });
  // the second chart shows big values; shorten its value labels
  $('#c-dist2').querySelectorAll('.col text:first-of-type').forEach((t, i) => t.textContent = compact(d.distribution[i].players));
}

async function load(entry) {
  const dir = `reports/${entry.period}/${entry.date}`;
  const [data, summary, insights] = await Promise.all([
    fetch(`${dir}/data.json`).then(r => r.json()),
    fetch(`${dir}/summary.en.md`).then(r => r.ok ? r.text() : null).catch(() => null),
    fetch(`${dir}/insights.json`).then(r => r.ok ? r.json() : null).catch(() => null),
  ]);
  window.__data = data; window.__summary = summary; window.__insights = insights;
  render(data, summary);
}

const PERIOD_NAMES = { daily: "Day", weekly: "Week", monthly: "Month" };
(async () => {
  const idx = (await fetch("reports/index.json").then(r => r.json()).catch(() => [])).filter(r => r.period);
  if (!idx.length) { $("#app").innerHTML = "<p class=\"empty\">No issues yet.</p>"; return; }
  const q = new URLSearchParams(location.search);
  let period = PERIOD_NAMES[q.get("p")] && idx.some(r => r.period === q.get("p")) ? q.get("p") : (idx.some(r => r.period === "daily") ? "daily" : idx.at(-1).period);
  const sel = $("#issue"), tabs = $("#tabs");
  const show = async (p, date) => {
    period = p;
    const list = idx.filter(r => r.period === p);
    const entry = list.find(r => r.date === date) || list.at(-1);
    tabs.innerHTML = Object.entries(PERIOD_NAMES).map(([k, n]) => `<button role="tab" data-p="${k}" aria-selected="${k === p}" ${idx.some(r => r.period === k) ? "" : "disabled title=\"The first issue is not out yet\""}>${n}</button>`).join("");
    sel.innerHTML = [...list].reverse().map(r => `<option value="${r.date}">${dmy(r.date)}</option>`).join("");
    sel.value = entry.date;
    history.replaceState(null, "", `?p=${p}&d=${entry.date}`);
    await load(entry);
  };
  tabs.onclick = e => { const b = e.target.closest("button[data-p]"); if (b && !b.disabled) show(b.dataset.p); };
  sel.onchange = () => show(period, sel.value);
  await show(period, q.get("d"));
  let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => render(window.__data, window.__summary), 150); });
})();
</script>
</body>
</html>
